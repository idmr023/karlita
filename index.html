<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Karla Paola Fest - Mis Dulces 16</title>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Great+Vibes&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>

        :root {

            --bg-color: #0A0A0C;

            --indigo-dark: #2D2554;

            --neon-purple: #9B5DE5;

            --pastel-lilac: #DAB6FC;

            --pure-white: #FFFFFF;

        }



        body {

            background-color: var(--bg-color);

            background-image: repeating-linear-gradient(45deg, #0f0f12, #0f0f12 10px, #0a0a0c 10px, #0a0a0c 20px);

            color: var(--pure-white);

            font-family: 'Montserrat', sans-serif;

            margin: 0;

            padding: 20px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            min-height: 100vh;

            text-align: center;

        }



        .container { max-width: 500px; width: 100%; position: relative; }



        /* Logo */

        .logo {

            max-width: 150px;

            border-radius: 50%;

            margin-bottom: 10px;

            border: 2px solid var(--neon-purple);

            box-shadow: 0 0 15px var(--neon-purple);

        }



        /* Estilos de Bloques */

        .title { font-family: 'Cinzel', serif; font-size: 3.5rem; color: white; text-shadow: 0 0 15px var(--neon-purple), 0 0 30px var(--neon-purple); margin: 0; }

        .cursive { font-family: 'Great Vibes', cursive; color: var(--indigo-dark); font-size: 2.5rem; }

        .block-4 { font-family: 'Cinzel', serif; font-weight: bold; font-size: 1.5rem; margin: 20px 0; }

        .small-text { font-size: 0.9rem; letter-spacing: 1px; }



        /* Decoración */

        .bunting { margin-bottom: 20px; color: var(--pastel-lilac); font-size: 2rem; }

        

        .btn {

            background-color: var(--neon-purple); color: var(--pure-white);

            padding: 12px 20px; border: none;

            border-radius: 50px; text-transform: uppercase;

            font-weight: bold; cursor: pointer; margin: 5px;

            font-family: 'Montserrat', sans-serif;

            font-size: 0.9rem;

        }



        .share-btn { background-color: var(--pastel-lilac); color: var(--indigo-dark); }

        .map-btn { background-color: var(--pure-white); color: var(--indigo-dark); }



        

        .purchased {
            text-decoration: line-through;
            opacity: 0.6;
        }

        /* Modal (Corrección: ahora sí tiene display:none por defecto) */

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; backdrop-filter: blur(5px); z-index: 1000; }

        .modal-content { 

            background: rgba(45, 37, 84, 0.95); padding: 30px; border-radius: 25px; width: 90%; max-width: 400px; 

            border: 2px solid var(--neon-purple); color: white; font-family: 'Montserrat', sans-serif;

        }



        .volume-control {

            margin-top: 15px;

            color: var(--pure-white);

            font-size: 0.9rem;

        }

        .gift-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            max-height: 60vh;
            overflow-y: auto;
            padding: 10px 0;
            margin: 15px 0;
        }

        .gift-card {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
            position: relative;
        }

        .gift-card:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.02);
        }

        .gift-card.taken {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: #666;
        }

        .gift-card.taken .gift-name {
            text-decoration: line-through;
        }

        .gift-card.taken::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            color: #4CAF50;
            text-shadow: 0 0 10px #4CAF50;
        }

        .gift-image {
            width: 100%;
            height: 80px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 8px;
        }

        .gift-name {
            font-size: 0.8rem;
            font-weight: 600;
            word-wrap: break-word;
        }

        .loading-text {
            text-align: center;
            padding: 20px;
            color: var(--pastel-lilac);
        }

    </style>

</head>

<body>



    <div class="container">

        <div class="bunting">▼▼▼▼▼▼▼</div>

        <img src="logo_karla.jpg" alt="Logo Karla" class="logo">

        <h1 class="title">Karla Paola<br>Fest</h1>

        <div class="cursive">Mis dulces</div>

        <div class="title" style="font-size: 2rem;">16</div>

        <p class="small-text" style="margin-top: 30px;">TE INVITO A CELEBRAR<br>MI CUMPLEAÑOS</p>

        <div class="block-4">

            SÁBADO 26 DE SEPTIEMBRE<br>

            6:00PM (HORA EXACTA)

        </div>

        <p class="small-text">CALLE SANTA PAULA 177 DPTO 201<br>URBANIZACIÓN PANDO<br>CERCADO DE LIMA</p>

        <div style="margin-top: 30px;">

            <button id="giftBtn" class="btn">Regalos</button>

            <button id="playBtn" class="btn">Música 🎵</button>

            <a href="https://maps.app.goo.gl/TktK8CvgUYUsy2NP7" target="_blank" class="btn map-btn">Ver Mapa 📍</a>

            <button onclick="shareInvite()" class="btn share-btn">Compartir 📤</button>

            <div class="volume-control">

                Volumen: <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.65">

            </div>

        </div>

    </div>



    <div id="giftModal" class="modal">

        <div class="modal-content">

            <h3>Lista de Regalos</h3>

            <p style="font-size: 0.8rem; color: #DAB6FC; margin-bottom: 10px;">Toca un regalo para marcarlo como elegido</p>

            <ul id="giftList" style="list-style: none; padding: 0;"></ul>

            <button class="btn" style="background:#333;" onclick="closeModal()">Cerrar</button>

        </div>

    </div>



<!-- Firebase config -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAW1i-Be2FAxRGlbkdurg9_kBJoY_7tioY",
            authDomain: "cumplekarla-ba6cf.firebaseapp.com",
            projectId: "cumplekarla-ba6cf",
            storageBucket: "cumplekarla-ba6cf.firebasestorage.app",
            messagingSenderId: "1069820457386",
            appId: "1:1069820457386:web:a210945bdd6ad865dffbd3",
            measurementId: "G-6XBLZWXQMD"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
    </script>
    <!-- END CONFIGURACIÓN DE FIREBASE -->

    <script>

        const audio = new Audio('musica.mp3');

        audio.volume = 0.65; // Volumen inicial



        const playBtn = document.getElementById('playBtn');

        playBtn.onclick = () => {

            if (audio.paused) { audio.play(); playBtn.textContent = 'Pausar ⏸️'; }

            else { audio.pause(); playBtn.textContent = 'Música 🎵'; }

        };



        const volumeSlider = document.getElementById('volumeSlider');

        volumeSlider.oninput = (e) => { audio.volume = e.target.value; };



        const modal = document.getElementById('giftModal');

        document.getElementById('giftBtn').onclick = () => { loadGifts(); modal.style.display = 'flex'; };

        function closeModal() { modal.style.display = 'none'; }



        let products = [];

        async function loadProducts() {
            try {
                const response = await fetch('productos.json');
                products = await response.json();
            } catch (error) {
                console.error('Error cargando productos:', error);
                products = [];
            }
        }



        async function initializeGifts() {
            await loadProducts();

            if (db) {
                // Escuchar cambios en tiempo real desde Firestore
                db.collection('giftList').doc('main')
                    .onSnapshot(async doc => {
                        const data = doc.data();
                        if (data && data.gifts) {
                            renderGifts(data.gifts);
                        } else {
                            // Si aún no hay datos, inicializar con productos
                            const initialGifts = products.map(p => ({
                                nombre: p.nombre,
                                imagen: p.imagen,
                                taken: false
                            }));
                            await db.collection('giftList').doc('main').set({ gifts: initialGifts });
                        }
                    });
            } else {
                // Fallback: localStorage
                console.warn('Firebase no está configurado. Usando localStorage.');
                renderGifts(JSON.parse(localStorage.getItem('gifts')) || products.map(p => ({ ...p, taken: false })));
            }
        }



        function renderGifts(gifts) {
            const list = document.getElementById('giftList');
            list.innerHTML = '';

            if (!gifts.length) {
                list.innerHTML = '<p class="loading-text">Cargando regalos...</p>';
                return;
            }

            gifts.forEach((gift, index) => {
                const li = document.createElement('li');

                li.innerHTML = `
                    <div class="gift-card ${gift.taken ? 'taken' : ''}" onclick="toggleTaken(${index})">
                        <img src="${gift.imagen || ''}" alt="${gift.nombre}" class="gift-image" onerror="this.style.display='none'">
                        <div class="gift-name">${gift.nombre}</div>
                    </div>
                `;

                list.appendChild(li);
            });
        }



        async function toggleTaken(index) {
            if (!db) return;

            const docRef = db.collection('giftList').doc('main');
            const doc = await docRef.get();

            if (doc.exists) {
                const gifts = doc.data().gifts;
                gifts[index].taken = !gifts[index].taken;
                await docRef.update({ gifts });
            }
        }



        function shareInvite() {

            const text = "¡Hola! Estás invitado al Karla Paola Fest - Mis Dulces 16. ¡Será una noche alucinante y llena de magia neón! 💜✨ Te espero aquí: " + window.location.href;

            if (navigator.share) {

                navigator.share({ title: 'Karla Paola Fest', text: text });

            } else {

                navigator.clipboard.writeText(text);

                alert("Invitación copiada al portapapeles. ¡Compártela con tus amigos!");

            }

        }



        // Initialize
        if (db) {
            initializeGifts();
        } else {
            loadProducts().then(() => renderGifts(products.map(p => ({ ...p, taken: false }))));
        }

        // Compatibility: cargar al abrir el modal
        async function loadGifts() {
            const list = document.getElementById('giftList');
            list.innerHTML = '<p class="loading-text">Cargando regalos...</p>';
        }

    </script>

</body>

</html>
